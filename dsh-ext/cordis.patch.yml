# lawbench-dsh 组合包配置补丁（Spec 3.1）。
# 叠加顺序：dsh-base → dsh-web-app（含其 presets/*）→ 本文件。按行 id 整行替换 config 或 disabled: true。
# 替换的是整行 config：没写的字段会丢，所以每行写全自己要的字段。
# 行 id 以 DSH 固定提交 477b4f420553e8a52c2fbccc464d7561b239c443 为准，换提交要重新核对。

# ── 1. 关掉的行 ────────────────────────────────────────────────────────────

# 官方 preset：都挂了命令、文件工具（D4）
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# 联网
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: mcp-resources
  disabled: true

# 插件管理（会用 pnpm 在线安装插件）
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# DeepSeek 账号和官方模型
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true

# 遥测和反馈（另在环境变量中设 DSH_TELEMETRY_DISABLED=1）
- id: session-telemetry-otel
  disabled: true
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true

# 标题生成（改由我方插件设标题）
- id: session-title-llm
  disabled: true

# 文档预览（会在 DSH 目录缓存 PDF）
- id: ui-sidebar-documentpreview
  disabled: true
- id: office-to-pdf
  disabled: true

# 官方品牌（第 3.4 节换成我方品牌）
- id: ui-brand-official
  disabled: true

# ── 1b. 清单外、T4 复核反向检查补关的行（返修 2026-09-29）──────────────────

# 侧栏浏览器：web profile 下关、desktop 下开；独立分区 webview 可访问任意网址（P1-1）
- id: ui-sidebar-browser
  disabled: true

# 模型设置页：可自建指向任意地址的模型路由并覆盖 llm-pi-ai 行（P2-1）；服务器地址只在我方设置页改
- id: ui-settings-models
  disabled: true

# 账号设置页和账号服务：DeepSeek 登录、充值、用量链接、飞书反馈表单（P2-2）
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true

# 程序化工具调用运行时：mode 为 ptc / both 时给模型 run_code（P2-3，另见下方 tools 行锁 native）
- id: ptc-runtime
  disabled: true

# DeepSeek 会话日志（目前不起作用，顺手关）
- id: session-log-deepseek
  disabled: true

# ── 2. 改配置的行 ──────────────────────────────────────────────────────────

# 默认 preset 指向律师工作台；不改的话仍指向已关掉的 standard，新建会话报 agent-preset/not-found
- id: agent-preset-registry
  config:
    default: lawbench

# 律所模型路由（Spec 8.1、8.2）。
# pi-ai 把模型条目的 id 原样作为请求里的 model 发给网关，没有单独的"上游模型名"字段，
# 所以三个窗口条目无法都发 qwen38-27b —— 按 Spec 8.2 备选：只配一个 128K 条目（结论记在 dsh-patches\PATCHES.md）。
# 思考档：chat-template 格式按档位填 chat_template_kwargs；关闭档 enable_thinking=false 且不带 reasoning_effort。
# 重试（Spec 8.3）：llm-retry 行本身没有配置项，重试策略在路由的 retryPolicy 上；
# 默认可重试错误码只有空响应、限流、服务端错误、超时、传输错误，不含 401 / 403。
- id: llm-pi-ai
  config:
    providers:
      lawfirm:
        displayName: 律所模型
        api: openai-completions
        baseURL: http://127.0.0.1:18765/v1
        apiKeyEnv: LAWFIRM_KEY
        timeoutMs: 1200000
        retryPolicy:
          mode: normal
          maxRetries: 1
        models:
          - id: qwen38-27b
            name: 律所模型（128K）
            contextWindow: 131072
            input: [text]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              # 6000D 只接受 low / medium / xhigh（实测 2026-09-29：high 返回 400），界面"高"发 xhigh
              high: xhigh
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
            reasoning_effort:
              $var: thinking.effort
              omitWhenOff: true

# 新会话默认用律所路由（base 默认是 deepseek-official / deepseek-flash，已关掉）
- id: agent-default-model
  config:
    provider: lawfirm
    model: qwen38-27b

# 工具呈现模式锁成 native，不受环境变量 DSH_TOOLS_MODE 影响（P2-3）
- id: tools
  config:
    mode: native
    maxParallelSubCalls: 10

# 工具结果永远不溢出到文件（阈值大于模型窗口，Spec 3.3）
- id: spill-policy
  config:
    maxInlineTokens: 1000000

- id: spill-local
  config:
    cleanupPeriodDays: 1

# 开发者模式（界面叫"代码工作工具"）默认关闭：新安装默认是开，开着时新会话页显示 preset 选择入口
- id: ui-settings
  config:
    enabled: false

# 界面固定中文
- id: locale
  config:
    preference: zh

# 首次使用目录指向应用数据下的空目录，避免在"文档"里建 deepseek-harness/default-workspace
- id: workspace-controller
  config:
    documentsDirectory: !!js "process.getBuiltinModule('node:path').join(process.env.LOCALAPPDATA ?? process.getBuiltinModule('node:os').homedir(), 'lawbench', 'dsh-documents')"
    documentsLookupTimeoutMs: 10000

# ── 3. 律师工作台 preset ───────────────────────────────────────────────────

- insert:
    - id: preset-lawbench
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lawbench
        name: 律师工作台
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              # 通用规则（Spec 9.2）全文在组合包的 persona.md（执行令 Q8：单独成文件由组合包引用）；
              # 去掉文件首行的"【草稿…】"标记后作为系统提示
              prefix: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('lawbench-dsh/persona.md'), 'utf8').replace(/^【草稿[^\\n]*\\n+/, '').trim()"
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: lawbench-skills
              includeDefaultRoots: false
              watch: false
              # Spec 10.1：管理员目录 %ProgramData%\lawbench\skills 在前（DSH 同级先到先得，同名时它覆盖内置），
              # 内置目录 <安装目录>\skills 在后；开发期内置目录由 LAWBENCH_SKILLS_DIR 指定，打包后由 Host 固定为安装目录（T20 待办）
              customSkillDirs: !!js "[process.getBuiltinModule('node:path').join(process.env.ProgramData ?? 'C:\\\\ProgramData', 'lawbench', 'skills'), process.env.LAWBENCH_SKILLS_DIR].filter(Boolean)"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 我方 Agent 插件：注册 11 个 case_* 工具；取任务与上下文、预算、思考档、进度与结束（Spec 1.2、9.2）
          - id: legal-agent
            name: 'lawbench-dsh/agent'
            config:
              validateContracts: true

# ── 4. 我方全局行（T7）──────────────────────────────────────────────────────

# 凭据：原 credentials 行（@deepseek-ai/dsh-credentials-local，Key 明文存 $DSH_HOME\.credentials.yaml）关掉，
# 另插我方凭据插件提供同名服务 credentials（执行令 Q1：补丁不能改行的插件名，整行替换走不通）
- id: credentials
  disabled: true

- insert:
    - id: legal-credentials
      name: 'lawbench-dsh/credentials'

    # 启动并看护工作台服务（Spec 1.3）；提供 lawbenchCore 服务和远程命名空间 lawbench
    # 开发期由环境变量给出启动命令等；打包后由 T20 固定为内置 Python 与安装目录
    - id: legal-host
      name: 'lawbench-dsh/host'
      config:
        command: !!js "JSON.parse(process.env.LAWBENCH_SERVICE_CMD ?? '[]')"
        cwd: !!js "process.env.LAWBENCH_SERVICE_CWD ?? process.getBuiltinModule('node:os').homedir()"
        appData: !!js "process.getBuiltinModule('node:path').join(process.env.LOCALAPPDATA ?? process.getBuiltinModule('node:os').homedir(), 'lawbench')"
        forwardPort: 18765
        portRange: !!js "process.env.LAWBENCH_SERVICE_PORTS ? process.env.LAWBENCH_SERVICE_PORTS.split('-').map(Number) : undefined"
        env: !!js "JSON.parse(process.env.LAWBENCH_SERVICE_ENV ?? '{}')"
