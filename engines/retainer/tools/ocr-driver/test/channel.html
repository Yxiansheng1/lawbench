<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src http://127.0.0.1:17801; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>通道验证 · 正例（CSP 已放行本机驱动）</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#2C2C2A;background:#F7F7F5}
h1{margin:0 0 4px;font-size:18px;font-weight:500}
.sub{color:#5F5E5A;margin:0 0 16px;font-size:13px}
.card{background:#fff;border:1px solid #E3E2DE;border-radius:10px;padding:16px;margin-bottom:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
button,label.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid #C9C8C2;background:#fff;cursor:pointer}
button.primary{background:#185FA5;border-color:#185FA5;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.verdict{margin-top:10px;padding:10px 12px;border-radius:8px;font-weight:500}
.verdict.pass{background:#E1F5EE;color:#085041;border:1px solid #0F6E56}
.verdict.fail{background:#FCEBEB;color:#791F1F;border:1px solid #A32D2D}
#log{height:260px;overflow:auto;background:#FCFCFB;border:1px solid #E3E2DE;border-radius:8px;padding:10px;font:13px/1.7 "Cascadia Mono",Consolas,monospace}
.line{display:flex;gap:10px}
.line .t{color:#888780;flex:0 0 78px}
.line.ok .m{color:#0F6E56}
.line.err .m{color:#A32D2D}
.line.hint .m{color:#5F5E5A}
#result .row{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-bottom:1px solid #EFEFEC}
#result .row .meta{color:#888780;font-size:12px;white-space:nowrap}
#lines{margin-top:8px}
</style>
</head><body>
<h1>通道验证 · 正例</h1>
<p class="sub">CSP 已放行 <code>http://127.0.0.1:17801</code>，预期：探测成功、可上传识别。</p>

<div class="card">
  <div class="acts">
    <button id="probe" class="primary">探测本机驱动</button>
    <button id="showCsp">查看本页 CSP</button>
    <label class="btn">选择证件文件（图片 / PDF / DOCX）<input id="upload" type="file" accept="image/*,.pdf,.docx" hidden disabled></label>
  </div>
  <div id="verdict" class="verdict" hidden></div>
</div>

<div class="card"><div id="log"></div></div>

<div class="card" id="result" hidden>
  <strong>识别结果（带坐标的文本行，未做字段解析）</strong>
  <div id="lines"></div>
</div>

<script src="channel.js"></script>
</body></html>
