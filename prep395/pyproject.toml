[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prep395"
version = "1.0.0"
description = "395 预处理服务：单页识别与 9B 抽取（lawbench Spec 第 6 节）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.54,<0.55",   # __main__ 用了内部接口 Server._serve，升级前要核对
    "httpx>=0.27",
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.20", "referencing>=0.35", "pypdfium2>=4"]

[tool.setuptools]
packages = ["prep395"]

[tool.pytest.ini_options]
testpaths = ["tests"]
