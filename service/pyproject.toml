[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbench-service"
version = "0.1.0"
description = "律所本地 AI 工作台：工作台服务（Spec 第 4 节）"
requires-python = ">=3.12,<3.13"
# 实际使用的依赖；下界为开发时实测版本，上界为下一个主版本
dependencies = [
  "starlette>=1.7,<2",
  "uvicorn>=0.54,<1",
  "anyio>=4.15,<5",
  "httpx>=0.28.1,<0.29",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<0.38",
  "keyring>=25.7,<26",
  "pypdfium2>=5.13,<6",
  "lxml>=6.1,<7",
  "openpyxl>=3.1.5,<4",
  "Pillow>=12.3,<13",
  "olefile>=0.47,<0.48",
  # 真 token 计数（llm/tokens.py）：只用 Tokenizer.from_file 读本地 tokenizer.json，不联网
  "tokenizers>=0.23.2,<0.24",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]
retainer = [
  # 委托材料的证件识别驱动（engines/retainer/tools/ocr-driver，Spec 13.5）：rapidocr 3.9.2 由驱动 vendor/ 自带，
  # 这里是它运行和导入时要的包（T25 调研：requests 在导入阶段就会加载，PDF 要 PyMuPDF）。pywin32 驱动不用，不装。
  # 单列一组：服务代码本身不用这些（R15 不许服务依赖 PyYAML），打包时随客户端 Python 一起装（pip install .[retainer]）。
  "onnxruntime>=1.24.4,<1.25",
  "opencv-python-headless>=5.0,<6",
  "pyclipper>=1.4,<2",
  "shapely>=2.1,<3",
  "six>=1.17,<2",
  "PyYAML>=6.0,<7",
  "tqdm>=4.70,<5",
  "colorlog>=6.12,<7",
  "requests>=2.34,<3",
  "PyMuPDF>=1.28,<2",
]

[tool.setuptools.packages.find]
include = ["lawbench*"]

[tool.setuptools.package-data]
"lawbench.export" = ["templates/*.docx"]   # 导出用的占位模板（T15）

[tool.pytest.ini_options]
testpaths = ["tests"]
