[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbench-service"
version = "0.1.0"
description = "律所本地 AI 工作台：工作台服务（Spec 第 4 节）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "jsonschema",
  "referencing",
  "pyyaml",
  "keyring",
  "pypdfium2",
  "lxml",
  "openpyxl",
  "Pillow",
  "olefile",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["lawbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
