[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbench-service"
version = "0.1.0"
description = "律所本地 AI 工作台：工作台服务（Spec 第 4 节）"
requires-python = ">=3.12,<3.13"
# 实际使用的依赖；下界为开发时实测版本，上界为下一个主版本
dependencies = [
  "starlette>=1.7,<2",
  "uvicorn>=0.54,<1",
  "anyio>=4.15,<5",
  "httpx>=0.28.1,<0.29",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<0.38",
  "keyring>=25.7,<26",
  "pypdfium2>=5.13,<6",
  "lxml>=6.1,<7",
  "openpyxl>=3.1.5,<4",
  "Pillow>=12.3,<13",
  "olefile>=0.47,<0.48",
  # 真 token 计数（llm/tokens.py）：只用 Tokenizer.from_file 读本地 tokenizer.json，不联网
  "tokenizers>=0.23.2,<0.24",
]

[project.optional-dependencies]
test = ["pytest>=9.1,<10"]

[tool.setuptools.packages.find]
include = ["lawbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
